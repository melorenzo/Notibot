# nginx-panel.conf — panelnoti.fullware.com.ar → panel del Notibot (127.0.0.1:8030)
#
# Instalación:
#   sudo cp deploy/nginx-panel.conf /etc/nginx/sites-available/notibot-panel
#   sudo ln -sf /etc/nginx/sites-available/notibot-panel /etc/nginx/sites-enabled/notibot-panel
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d panelnoti.fullware.com.ar    # agrega el bloque 443 y el redirect
#
# Esta versión no trae TLS a propósito: si el bloque 443 apuntara a certificados
# que todavía no existen, nginx no arranca. Certbot los agrega al final.

server {
    listen 80;
    listen [::]:80;
    server_name panelnoti.fullware.com.ar;

    access_log /var/log/nginx/notibot-panel.access.log;
    error_log  /var/log/nginx/notibot-panel.error.log;

    # el panel no sube archivos grandes; 10m es de sobra para los formularios
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8030;
        proxy_http_version 1.1;

        # PANEL_TRUST_PROXY=1 en variables.env: el panel usa estas cabeceras
        # para el límite de intentos y para marcar la cookie como Secure.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # una corrida manual del panel puede tardar en responder
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
